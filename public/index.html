<!DOCTYPE html>
<html lang="pl" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPi5 Media Center</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#15181c">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-body-tertiary" style="padding-bottom: 90px;">
  <div class="container py-4">
    <header class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div class="d-flex align-items-center gap-2">
        <h3 class="fw-bold m-0">RPi Media Server</h3>
      </div>
      <span class="badge bg-primary px-3 py-2 rounded-pill">RPi 5 Local</span>
    </header>

    <ul class="nav nav-pills mb-4 gap-2" id="mediaTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active px-4 py-2" id="videos-tab" data-bs-toggle="pill" data-bs-target="#tab-videos" type="button">Wideo</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link px-4 py-2" id="music-tab" data-bs-toggle="pill" data-bs-target="#tab-music" type="button">Muzyka</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link px-4 py-2" id="photos-tab" data-bs-toggle="pill" data-bs-target="#tab-photos" type="button">Zdjęcia</button>
      </li>
      <li class="nav-item ms-auto" role="presentation">
        <button class="nav-link px-4 py-2 bg-secondary text-white" id="system-tab" data-bs-toggle="pill" data-bs-target="#tab-system" type="button">System & Upload</button>
      </li>
    </ul>

    <div class="tab-content" id="mediaTabsContent">
      <div class="tab-pane fade show active" id="tab-videos" role="tabpanel">
        <div class="row g-3" id="videoAlbumsView"></div>

        <div id="videoInsideAlbumView" class="d-none">
          <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-secondary">
            <button class="btn btn-outline-light btn-sm px-3 me-3 back-btn" id="backToVideoAlbumsBtn">
              &larr; Wróć
            </button>
            <h4 class="m-0 fw-bold text-white" id="currentVideoAlbumTitle"></h4>
          </div>
          <div class="row g-4">
            <div class="col-lg-8">
              <div class="video-wrapper">
                <video id="mainVideoPlayer" controls></video>
              </div>
              <h5 id="videoTitle" class="mt-3 text-secondary text-truncate"></h5>
            </div>
            <div class="col-lg-4">
              <div class="card bg-dark border-0 p-3 h-100">
                <div class="list-group media-list-group overflow-auto" style="max-height: 480px;" id="videoList"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-music" role="tabpanel">
        <div class="row g-3" id="musicAlbumsView"></div>

        <div id="musicInsideAlbumView" class="d-none">
          <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-secondary">
            <button class="btn btn-outline-light btn-sm px-3 me-3 back-btn" id="backToMusicAlbumsBtn">
              &larr; Wróć
            </button>
            <h4 class="m-0 fw-bold text-white" id="currentMusicAlbumTitle"></h4>
          </div>
          
          <div class="card bg-dark border-0 p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <input type="text" id="musicSearchInput" class="form-control bg-dark text-white border-secondary w-50" placeholder="Szukaj utworu...">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="autoplaySwitch" checked>
                <label class="form-check-label text-white text-nowrap" for="autoplaySwitch">Graj następny</label>
              </div>
            </div>
            <div class="list-group media-list-group" id="musicList"></div>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-photos" role="tabpanel">
        <div class="row g-3" id="photoAlbumsView"></div>

        <div id="photosInsideAlbumView" class="d-none">
          <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-secondary">
            <button class="btn btn-outline-light btn-sm px-3 me-3 back-btn" id="backToPhotoAlbumsBtn">
              &larr; Wróć
            </button>
            <h4 class="m-0 fw-bold text-white" id="currentPhotoAlbumTitle"></h4>
          </div>
          <div class="row g-3" id="photoGallery"></div>
        </div>
      </div>

      <div class="tab-pane fade" id="tab-system" role="tabpanel">
        <div class="row g-4">
          <div class="col-lg-5">
             <div class="card bg-dark border-0 p-4 shadow media-card">
               <h4 class="mb-4 text-primary">Zasoby Systemu</h4>
               <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2">
                 <span class="text-secondary">Temperatura CPU</span>
                 <span id="sysCpuTemp" class="fw-bold">...</span>
               </div>
               <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2">
                 <span class="text-secondary">Pamięć RAM</span>
                 <span id="sysRamUsage" class="fw-bold">...</span>
               </div>
               <div class="d-flex justify-content-between">
                 <span class="text-secondary">Przestrzeń Dysku</span>
                 <span id="sysStorage" class="fw-bold">...</span>
               </div>
             </div>
          </div>
          <div class="col-lg-7">
             <div class="card bg-dark border-0 p-4 shadow media-card">
               <h4 class="mb-4 text-primary">Upload Plików</h4>
               <form id="uploadForm">
                 <div class="row g-3 mb-3">
                   <div class="col-md-4">
                     <select id="uploadType" class="form-select bg-dark text-white border-secondary">
                       <option value="videos">Wideo</option>
                       <option value="music">Muzyka</option>
                       <option value="photos">Zdjęcia</option>
                     </select>
                   </div>
                   <div class="col-md-8">
                     <input type="text" id="uploadAlbum" class="form-control bg-dark text-white border-secondary" placeholder="Nazwa folderu (albumu)" required>
                   </div>
                 </div>
                 <input type="file" id="uploadFiles" class="form-control mb-3 bg-dark text-white border-secondary" multiple required>
                 <button type="submit" class="btn btn-primary w-100 fw-bold">Wyślij na serwer</button>
               </form>
               <div id="uploadStatus" class="alert alert-success mt-3 py-2 d-none">Pliki zostały wgrane pomyślnie.</div>
             </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="photoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title text-white text-truncate" id="modalImageTitle"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>
        <div class="modal-body" id="photoModalBody">
          <img id="modalPreviewImg" src="" alt="Preview">
        </div>
      </div>
    </div>
  </div>

  <div id="stickyPlayerContainer" class="fixed-bottom bg-dark border-top border-secondary shadow-lg d-none" style="z-index: 1050; padding: 12px 0;">
    <div class="container d-flex align-items-center gap-3">
      <img id="globalMusicCoverArt" src="" alt="Cover" class="rounded shadow-sm" style="width: 50px; height: 50px; object-fit: cover; display: none;">
      <div id="globalMusicDefaultIcon" class="text-primary">
        <svg width="50" height="50" fill="currentColor" viewBox="0 0 16 16">
          <path d="M6 13c0 1.105-1.12 2-2.5 2S1 14.105 1 13s1.12-2 2.5-2 2.5.895 2.5 2"/>
          <path fill-rule="evenodd" d="M14 11V2h1v9h-1z"/>
          <path d="M6 3v10H5V3z"/>
          <path d="M5 2.905a1 1 0 0 1 .9-.995l8-.8A1 1 0 0 1 15 2.1v2.82a1 1 0 0 1-.9.995l-8 .8A1 1 0 0 1 5 5.72z"/>
        </svg>
      </div>
      <div class="flex-grow-1 text-truncate" style="max-width: 250px;">
        <h6 id="globalAudioTitle" class="fw-bold mb-0 text-white text-truncate">...</h6>
        <small id="globalAudioArtist" class="text-secondary text-truncate d-block">...</small>
      </div>
      <audio id="mainAudioPlayer" controls class="flex-grow-1 mx-2" style="height: 45px; max-width: 500px;"></audio>
      <button id="closeStickyPlayerBtn" class="btn btn-outline-secondary btn-sm border-0 px-2 ms-auto" aria-label="Zamknij odtwarzacz">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.error(err);
        });
      });
    }
  </script>
</body>
</html>
